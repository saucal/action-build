name: "Checkout and Build"
description: ""
inputs:
  path:
    description: "Path"
    required: true
  satis_key:
    description: "SatisPress Key (packages.saucal.com)"
    required: false
    default: ''
  node_version:
    description: "The Node version for actions/setup-node"
    required: false
    default: '16'
  pnpm_version:
    description: "The pnpm version for pnpm/action-setup"
    required: false
    default: '6'
  php_version:
    description: "The PHP version for actions/setup-php"
    required: false
    default: 'latest'
  php_extensions:
    description: "The extensions parameter for actions/setup-php"
    required: false
    default: 'mbstring'
  composer_version:
    description: "The Composer version for actions/setup-php"
    required: false
    default: 'v2'
  validate-composer:
    description: "Validate composer?"
    required: false
    default: 'true'
    
runs:
  using: "composite"
  steps:
    - name: Hash Files
      id: hash-the-files
      shell: bash
      env:
        BUILD_COMPOSER_HASH: >-
          ${{
            hashFiles(
              'composer.json',
              'composer.lock',
              'plugins/*/composer.json',
              'plugins/*/composer.lock',
              'themes/*/composer.json',
              'themes/*/composer.lock',
              'mu-plugins/*/composer.json',
              'mu-plugins/*/composer.lock',
              'wp-content/plugins/*/composer.json',
              'wp-content/plugins/*/composer.lock',
              'wp-content/themes/*/composer.json',
              'wp-content/themes/*/composer.lock',
              'wp-content/mu-plugins/*/composer.json',
              'wp-content/mu-plugins/*/composer.lock'
            )
          }}
        BUILD_NODE_HASH: >-
          ${{
            hashFiles(
              'package.json',
              'plugins/*/package.json',
              'themes/*/package.json',
              'mu-plugins/*/package.json',
              'wp-content/plugins/*/package.json',
              'wp-content/themes/*/package.json',
              'wp-content/mu-plugins/*/package.json'
            )
          }}
        BUILD_NPM_HASH: >-
          ${{
            hashFiles(
              'package-lock.json',
              'plugins/*/package-lock.json',
              'themes/*/package-lock.json',
              'mu-plugins/*/package-lock.json',
              'wp-content/plugins/*/package-lock.json',
              'wp-content/themes/*/package-lock.json',
              'wp-content/mu-plugins/*/package-lock.json'
            )
          }}
        BUILD_PNPM_HASH: >-
          ${{
            hashFiles(
              'pnpm-lock.yaml',
              'plugins/*/pnpm-lock.yaml',
              'themes/*/pnpm-lock.yaml',
              'mu-plugins/*/pnpm-lock.yaml',
              'wp-content/plugins/*/pnpm-lock.yaml',
              'wp-content/themes/*/pnpm-lock.yaml',
              'wp-content/mu-plugins/*/pnpm-lock.yaml'
            )
          }}
      run: |
        echo "composer_hash=$BUILD_COMPOSER_HASH" >> "$GITHUB_OUTPUT"
        echo "node_hash=$BUILD_NODE_HASH" >> "$GITHUB_OUTPUT"
        echo "npm_hash=$BUILD_NPM_HASH" >> "$GITHUB_OUTPUT"
        echo "pnpm_hash=$BUILD_PNPM_HASH" >> "$GITHUB_OUTPUT"
    - uses: "shivammathur/setup-php@v2"
      if: ${{ steps.hash-the-files.outputs.composer_hash != '' }}
      with:
        php-version: "${{ inputs.php_version }}"
        tools: "composer:${{ inputs.composer_version }}"
        extensions: "${{ inputs.php_extensions }}"

    - name: Get composer store directory
      if: ${{ steps.hash-the-files.outputs.composer_hash != '' }}
      id: composer-cache-setup
      shell: bash
      run: |
        echo "cache_dir=$(composer global config cache-dir)" >> "$GITHUB_OUTPUT"
        echo "hash=${{ steps.hash-the-files.outputs.composer_hash }}" >> "$GITHUB_OUTPUT"

    - name: Cache composer
      if: ${{ steps.hash-the-files.outputs.composer_hash != '' }}
      id: cache-composer
      uses: actions/cache/restore@v4
      env:
        cache-name: cache-composer
      with:
        path: ${{ steps.composer-cache-setup.outputs.cache_dir }}
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ steps.composer-cache-setup.outputs.hash }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-

    - uses: actions/setup-node@v3
      if: ${{ steps.hash-the-files.outputs.node_hash != '' }}
      with:
        node-version: ${{ inputs.node_version }}

    - uses: pnpm/action-setup@v2.0.1
      if: ${{ steps.hash-the-files.outputs.pnpm_hash != '' }}
      name: Install pnpm
      id: pnpm-install
      with:
        version: ${{ inputs.pnpm_version }}

    - name: Get npm store directory
      if: ${{ steps.hash-the-files.outputs.node_hash != '' }}
      id: npm-cache-setup
      shell: bash
      run: |
        if [ "${{ steps.hash-the-files.outputs.pnpm_hash != '' }}" == "true" ]; then
          echo "cache_dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
          echo "hash=${{ steps.hash-the-files.outputs.pnpm_hash }}" >> "$GITHUB_OUTPUT"
        else
          echo "cache_dir=~/.npm" >> "$GITHUB_OUTPUT"
          echo "hash=${{ steps.hash-the-files.outputs.npm_hash }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Cache node modules
      if: ${{ steps.hash-the-files.outputs.node_hash != '' }}
      id: cache-npm
      uses: actions/cache/restore@v4
      env:
        cache-name: cache-node-modules
      with:
        path: ${{ steps.npm-cache-setup.outputs.cache_dir }}
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ steps.npm-cache-setup.outputs.hash }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-

    - name: Maybe Build And Cleanup
      shell: bash
      env:
        BUILD_DIR: ${{ inputs.path }}
        SATIS_KEY: ${{ inputs.satis_key }}
        VALIDATE_COMPOSER: ${{ inputs.validate-composer }}
      run: "${{ github.action_path }}/maybe-build.sh"

    - name: Save Composer Cache
      id: cache-composer-save
      if: steps.cache-composer.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        key: ${{ steps.cache-composer.outputs.cache-primary-key }}
        path: ${{ steps.composer-cache-setup.outputs.cache_dir }}

    - name: Save NPM Cache
      id: cache-npm-save
      if: steps.cache-npm.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        key: ${{ steps.cache-npm.outputs.cache-primary-key }}
        path: ${{ steps.npm-cache-setup.outputs.cache_dir }}
